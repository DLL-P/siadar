[project]
name = "siadar"
version = "0.1.0"
description = "Sistema Inteligente de Análise, Detecção de Anomalias e Resposta — detecção de intrusão em redes corporativas com machine learning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rafael (DLL)" }]
keywords = ["cybersecurity", "network-security", "intrusion-detection", "machine-learning", "ids"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "scapy>=2.5",
    "scikit-learn>=1.3",
    "SQLAlchemy>=2.0",
    "pandas>=2.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0"]

[project.scripts]
siadar-capture = "siadar.capture.live:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["siadar*"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
